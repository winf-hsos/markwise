[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "markwise"
version = "0.1.0"
description = "Paper exams with multiple-choice and free-text questions: question pools, exam building, printing, scan reading and grading."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nicolas Meseth" }]
dependencies = [
    "ruamel.yaml>=0.18",
    "tomli-w>=1.0",
    "typst>=0.13",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "segno>=1.6",
    "pywebview>=5.0",
    "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
markwise = "markwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
markwise = ["app/static/**/*", "app/markwise.ico", "typst/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
